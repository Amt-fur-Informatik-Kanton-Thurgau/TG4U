name: TG4U Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  MAVEN_ARGS: -Dmaven.repo.local=${{ github.workspace }}/.m2repo -ntp
  TG4U_EXTENSION_GROUP_ID: ch.tg4u
  TG4U_PLATFORM_EXTENSION_ARTIFACT: tg4u-platform-api-extension
  TG4U_ISSUER_EXTENSION_ARTIFACT: tg4u-issuer-extension
  TG4U_EXTENSION_VERSION: 1.0.0-SNAPSHOT
  IMAGE_PREFIX: ghcr.io/amt-fur-informatik-kanton-thurgau
  TG4U_REPOSITORY_URL: https://github.com/Amt-fur-Informatik-Kanton-Thurgau/TG4U

defaults:
  run:
    shell: bash

concurrency:
  group: tg4u-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signer-interface:
    name: Build signer interface
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    timeout-minutes: 45
    steps:
      - name: Check out TG4U sources
        uses: actions/checkout@v7

      - name: Read OSS revision
        id: oss
        run: |
          set -euo pipefail
          repository=$(awk -F= '$1 == "repository" {print $2}' oss.lock)
          repository=${repository#https://github.com/}
          repository=${repository%.git}
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "commit=$(awk -F= '$1 == "commit" {print $2}' oss.lock)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Heidi Platform
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.oss.outputs.repository }}
          ref: ${{ steps.oss.outputs.commit }}
          path: oss
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.3.1"

      # Both signer crates share one target directory, without debug info, to
      # keep the Rust build within the runner's disk space.
      - name: Publish signer interface to Maven Local
        working-directory: oss/heidi-signing-crypto
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        # CARGO_TARGET_DIR is exported in the shell: this job runs in a container,
        # where ${{ github.workspace }} is the host path, not the container's.
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/oss/heidi-signing-crypto/target"
          gradle --no-daemon publishToMavenLocal -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2repo"

      - name: Stage signer interface
        run: |
          set -euo pipefail
          mkdir -p signer-m2
          cp -r .m2repo/org/heidiverse signer-m2/

      - name: Upload signer interface
        uses: actions/upload-artifact@v7
        with:
          name: tg4u-release-signer-interface
          path: signer-m2
          retention-days: 1

  publish-images:
    name: Build and publish TG4U release artifacts
    needs: signer-interface
    # Restrict release publishing to the canonical Kanton repository.
    if: github.repository == 'Amt-fur-Informatik-Kanton-Thurgau/TG4U'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out TG4U sources
        uses: actions/checkout@v7

      - name: Read OSS revision
        id: oss
        run: |
          set -euo pipefail
          repository=$(awk -F= '$1 == "repository" {print $2}' oss.lock)
          repository=${repository#https://github.com/}
          repository=${repository%.git}
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "commit=$(awk -F= '$1 == "commit" {print $2}' oss.lock)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Heidi Platform
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.oss.outputs.repository }}
          ref: ${{ steps.oss.outputs.commit }}
          path: oss
          fetch-depth: 1

      - name: Derive release metadata
        id: release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: oss/heidi-web/pnpm-lock.yaml

      - name: Download signer interface
        uses: actions/download-artifact@v8
        with:
          name: tg4u-release-signer-interface
          path: signer-m2

      - name: Install signer interface into Maven Local
        run: |
          set -euo pipefail
          mkdir -p .m2repo/org
          cp -r signer-m2/heidiverse .m2repo/org/

      - name: Build shared signing modules
        working-directory: oss
        run: mvn -B -f heidi-shared-backend/pom.xml install -DskipTests

      - name: Check OSS OpenAPI snapshot
        # This snapshot is a generic OSS contract, so validate it before TG4U
        # controllers are added to the assembled API.
        run: >-
          mvn -B -f oss/heidi-platform-api/pom.xml
          -pl heidi-platform-api-ws -am
          -Dtest=OpenApiSnapshotIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Assemble TG4U web extension
        run: scripts/assemble-into-platform.sh "$GITHUB_WORKSPACE/oss"

      - name: Build TG4U backend extensions
        run: scripts/build-tg4u-backend.sh "$GITHUB_WORKSPACE/oss"

      - name: Install frontend dependencies
        working-directory: oss/heidi-web
        run: pnpm install --frozen-lockfile

      - name: Lint combined frontend
        working-directory: oss/heidi-web
        run: pnpm run lint

      - name: Build and type-check combined frontend
        working-directory: oss/heidi-web
        run: pnpm exec vite build && pnpm exec tsc -b

      - name: Test combined platform API
        env:
          HEIDI_ISSUER_API_KEY: ci-test-key
        run: |
          set -euo pipefail
          # The OSS OpenAPI snapshot must not include TG4U extension routes.
          mvn -B -f oss/heidi-platform-api/pom.xml \
            -Dheidi.extension.groupId="$TG4U_EXTENSION_GROUP_ID" \
            -Dheidi.extension.artifactId="$TG4U_PLATFORM_EXTENSION_ARTIFACT" \
            -Dheidi.extension.version="$TG4U_EXTENSION_VERSION" \
            -Dtest='!OpenApiSnapshotIntegrationTest' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -pl heidi-platform-api-ws -am test

      - name: Test combined issuer backend
        run: >-
          mvn -B -f oss/heidi-issuer-backend/pom.xml
          -Dheidi.extension.groupId="$TG4U_EXTENSION_GROUP_ID"
          -Dheidi.extension.artifactId="$TG4U_ISSUER_EXTENSION_ARTIFACT"
          -Dheidi.extension.version="$TG4U_EXTENSION_VERSION"
          test

      - name: Log in to GHCR
        # GHCR creates new packages as private; set each package to Public after its first push.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish platform API image
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          STABLE_RELEASE: ${{ steps.release.outputs.stable }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          extra=()
          [[ "$STABLE_RELEASE" == "true" ]] && extra+=(-Djib.to.tags=latest)
          mvn -B -f oss/heidi-platform-api/heidi-platform-api-ws/pom.xml -DskipTests \
            -Dheidi.extension.groupId="$TG4U_EXTENSION_GROUP_ID" \
            -Dheidi.extension.artifactId="$TG4U_PLATFORM_EXTENSION_ARTIFACT" \
            -Dheidi.extension.version="$TG4U_EXTENSION_VERSION" \
            -Djib.to.image="$IMAGE_PREFIX/tg4u-platform-api:$RELEASE_VERSION" \
            "${extra[@]}" \
            -Djib.to.auth.username="$REGISTRY_USER" \
            -Djib.to.auth.password="$REGISTRY_TOKEN" \
            package jib:build

      - name: Publish issuer image
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          STABLE_RELEASE: ${{ steps.release.outputs.stable }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          extra=()
          [[ "$STABLE_RELEASE" == "true" ]] && extra+=(-Djib.to.tags=latest)
          mvn -B -f oss/heidi-issuer-backend/heidi-issuer-ws/pom.xml -DskipTests \
            -Dheidi.extension.groupId="$TG4U_EXTENSION_GROUP_ID" \
            -Dheidi.extension.artifactId="$TG4U_ISSUER_EXTENSION_ARTIFACT" \
            -Dheidi.extension.version="$TG4U_EXTENSION_VERSION" \
            -Djib.to.image="$IMAGE_PREFIX/tg4u-issuer:$RELEASE_VERSION" \
            "${extra[@]}" \
            -Djib.to.auth.username="$REGISTRY_USER" \
            -Djib.to.auth.password="$REGISTRY_TOKEN" \
            package jib:build

      - name: Build verifier reactor
        run: >-
          mvn -B -f oss/heidi-verifier-backend/pom.xml
          -pl heidi-verifier-ws -am
          -DskipTests install

      - name: Publish verifier image
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          STABLE_RELEASE: ${{ steps.release.outputs.stable }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          extra=()
          [[ "$STABLE_RELEASE" == "true" ]] && extra+=(-Djib.to.tags=latest)
          mvn -B -f oss/heidi-verifier-backend/heidi-verifier-ws/pom.xml -DskipTests \
            -Djib.to.image="$IMAGE_PREFIX/tg4u-verifier:$RELEASE_VERSION" \
            "${extra[@]}" \
            -Djib.to.auth.username="$REGISTRY_USER" \
            -Djib.to.auth.password="$REGISTRY_TOKEN" \
            package jib:build

      - name: Build signing service reactor
        run: >-
          mvn -B -f oss/heidi-signing-service/pom.xml
          -pl software/service -am
          -DskipTests install

      - name: Publish signing service image
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          STABLE_RELEASE: ${{ steps.release.outputs.stable }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          extra=()
          [[ "$STABLE_RELEASE" == "true" ]] && extra+=(-Djib.to.tags=latest)
          mvn -B -f oss/heidi-signing-service/software/service/pom.xml -DskipTests \
            -Djib.to.image="$IMAGE_PREFIX/tg4u-signing-service:$RELEASE_VERSION" \
            "${extra[@]}" \
            -Djib.to.auth.username="$REGISTRY_USER" \
            -Djib.to.auth.password="$REGISTRY_TOKEN" \
            package jib:build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Package web image context
        run: tar -czf oss/heidi-web/docker/heidi-web/bin/heidi-web.tar.gz -C oss/heidi-web dist

      - name: Publish web image
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          STABLE_RELEASE: ${{ steps.release.outputs.stable }}
        run: |
          set -euo pipefail
          tags=(--tag "$IMAGE_PREFIX/tg4u-web:$RELEASE_VERSION")
          [[ "$STABLE_RELEASE" == "true" ]] && tags+=(--tag "$IMAGE_PREFIX/tg4u-web:latest")
          docker buildx build --push \
            --label "org.opencontainers.image.source=$TG4U_REPOSITORY_URL" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            "${tags[@]}" \
            oss/heidi-web/docker/heidi-web

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Publish Helm chart
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chart_package_dir="$RUNNER_TEMP/helm-chart"
          mkdir -p "$chart_package_dir"
          helm package helm/tg4u-platform \
            --version "$RELEASE_VERSION" \
            --app-version "$RELEASE_VERSION" \
            --destination "$chart_package_dir"
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io \
            --username "$REGISTRY_USER" \
            --password-stdin
          helm push "$chart_package_dir/tg4u-platform-$RELEASE_VERSION.tgz" \
            "oci://$IMAGE_PREFIX"
