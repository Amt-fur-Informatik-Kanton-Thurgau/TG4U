{{- $gen := .Values.global.devSecrets.generate }}
{{- $signingEnabled := ((.Values.signing | default dict).enabled | default false) }}
{{- $signingSecretName := $gen.signingClientSecretName | default (printf "%s-signing-clients" $gen.secretName) }}
{{- if $gen.enabled }}
{{- if and $signingEnabled (eq $signingSecretName $gen.secretName) }}
{{- fail "global.devSecrets.generate.signingClientSecretName must differ from secretName to keep signing seeds out of the shared Secret" }}
{{- end }}
{{- /* The development CA is a recipe like any other, added only when the
       platform API asks for one. Generated here rather than on the pod because
       this Secret is what makes it persist: the Job tops up missing keys and
       never rewrites an existing one, so the CA outlives pod restarts, replicas
       and upgrades, and is rotated only by deleting the Secret. */}}
{{- $devCa := (.Values.platformApi | default dict).devCa | default dict }}
{{- if $devCa.enabled }}
{{- $gen = merge (dict "recipes" (append $gen.recipes (dict
      "name" "HEIDI_DEV_CA_KEYSTORE_BASE64"
      "type" "p12"
      "ca" true
      "alias" "dev-ca"
      "passwordName" "HEIDI_DEV_CA_PASSWORD"
      "aliases" (list "HEIDI_PLATFORM_DEV_CA_KEYSTORE_BASE64")
      "passwordAliases" (list "HEIDI_PLATFORM_DEV_CA_PASSWORD")
      "subject" ($devCa.subject | default "/CN=Heidi Development CA")))) (deepCopy $gen) }}
{{- end }}
{{- /*
Generates the dev secrets that are not committed to the repo.

Runs as a pre-install/pre-upgrade hook so the Secret exists before any pod is
scheduled. It writes ONE Secret shared by every service: several of these keys
must be byte-identical across services — PIDI_TRUST_STATEMENTS_* and
ISSUANCE_ROOT_* in platform-api and verifier, HEIDI_ISSUER_API_KEY and the
basic-auth pair in platform-api and issuer — which a per-service or per-pod
generator could not guarantee.

Two containers because no maintained image carries both openssl and kubectl:
the init container generates every recipe into an emptyDir, then the main
container uploads only the keys the Secret does not already have. Regenerating
a value that turns out to be present costs a second or two in a hook Job and
avoids installing packages at deploy time.

Existing keys are never touched, so `helm upgrade` will not rotate a master key
out from under data encrypted with it. Adding a recipe tops the Secret up on
the next deploy.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $gen.secretName }}-generator
  namespace: {{ .Values.global.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $gen.secretName }}-generator
  namespace: {{ .Values.global.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  # create cannot be restricted by resourceNames — the object does not exist yet.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames:
      - {{ $gen.secretName | quote }}
      {{- if $signingEnabled }}
      - {{ $signingSecretName | quote }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $gen.secretName }}-generator
  namespace: {{ .Values.global.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $gen.secretName }}-generator
subjects:
  - kind: ServiceAccount
    name: {{ $gen.secretName }}-generator
    namespace: {{ .Values.global.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $gen.secretName }}-generator
  namespace: {{ .Values.global.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $gen.secretName }}-generator
      nodeSelector:
        "kubernetes.io/os": linux
      volumes:
        - name: work
          emptyDir: {}
        {{- if $signingEnabled }}
        - name: existing-signing-clients
          secret:
            secretName: {{ $signingSecretName }}
            optional: true
        {{- end }}
      initContainers:
        - name: generate
          image: {{ $gen.opensslImage }}
          volumeMounts:
            - name: work
              mountPath: /work
            {{- if $signingEnabled }}
            - name: existing-signing-clients
              mountPath: /existing-signing-clients
              readOnly: true
            {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              DAYS={{ $gen.certDays | default 730 }}
              OUT=/work

              # Charset from scripts/generate_p12.sh — excludes quotes,
              # backslashes and anything else hostile in a shell or YAML context.
              rand_pw()    { LC_ALL=C tr -dc 'A-Za-z0-9!@#%^&*()_+=-' < /dev/urandom 2>/dev/null | head -c "$1" || true; }
              rand_alnum() { LC_ALL=C tr -dc 'A-Za-z0-9'             < /dev/urandom 2>/dev/null | head -c "$1" || true; }

              # Every generator writes its values into $OUT as files named after
              # the Secret key they become.
              gen_random()       { rand_alnum "$2" > "$OUT/$1"; }
              gen_randomBase64() { openssl rand -base64 "$2" | tr -d '\n' > "$OUT/$1"; }
              # $2 bytes as 2*$2 lowercase hex chars. PIDI_AUTHORIZATION_* are
              # hex-decoded by the app, which rejects anything outside [0-9a-f]
              # and requires the full 64-char (32-byte) length.
              gen_randomHex()    { openssl rand -hex "$2" | tr -d '\n' > "$OUT/$1"; }

              # Keypairs are stored as base64 of the entire PEM text including its
              # headers — the encoding the apps' decodePem expects, matching
              # scripts/generate_ec_key.sh. `openssl base64 -A` keeps it on one
              # line; plain `base64` wraps at 76 columns and busybox has no -w.
              gen_ecKeyPair() { # $1=private  $2=public
                openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
                  -pkeyopt ec_param_enc:named_curve -out /tmp/k.pem 2>/dev/null
                openssl pkey -in /tmp/k.pem -pubout -out /tmp/k.pub 2>/dev/null
                openssl base64 -A -in /tmp/k.pem > "$OUT/$1"
                openssl base64 -A -in /tmp/k.pub > "$OUT/$2"
                rm -f /tmp/k.pem /tmp/k.pub
              }

              # $5 is the keystore ALIAS, and it is not cosmetic: the apps look the
              # key up by name. CertificateService asks for "issuance" as a
              # literal, so a keystore built without -name gets OpenSSL's default
              # alias of "1" and start-up dies with
              # "KeyStoreException: No private key found for alias: issuance".
              # The key is EC P-256, not RSA, and that is load-bearing:
              # CertificateService signs the issuer certificate it derives from
              # this root with a hardcoded "SHA256withECDSA"
              # (JcaContentSignerBuilder), so an RSA root fails at start-up with
              # "InvalidKeyException: can't identify EC private key". The local
              # development profile uses secp256r1 for the same reason.
              # A JWK in JSON form, which is what JwkUtil.parseOrGenerate expects.
              # SEC1 DER for P-256 has a fixed shape, so the scalar and the point
              # can be sliced out without an ASN.1 parser:
              #   30 77 02 01 01 04 20 <32-byte d> a0 0a <params> a1 44 03 42 00 04 <x||y>
              # d starts at offset 7, and the last 65 bytes are 0x04 || X || Y.
              b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
              gen_jwk() { # $1=key  $2=use (sig|enc)
                openssl ecparam -name prime256v1 -genkey -noout -out /tmp/j.pem 2>/dev/null
                openssl ec -in /tmp/j.pem -outform DER -out /tmp/j.der 2>/dev/null
                d=$(dd if=/tmp/j.der bs=1 skip=7 count=32 2>/dev/null | b64url)
                tail -c 64 /tmp/j.der > /tmp/j.xy
                x=$(head -c 32 /tmp/j.xy | b64url)
                y=$(tail -c 32 /tmp/j.xy | b64url)
                kid=$(openssl rand -hex 8)
                printf '{"kty":"EC","crv":"P-256","use":"%s","kid":"%s","x":"%s","y":"%s","d":"%s"}' \
                  "$2" "$kid" "$x" "$y" "$d" > "$OUT/$1"
                rm -f /tmp/j.pem /tmp/j.der /tmp/j.xy
              }

              gen_p12() { # $1=p12  $2=password  $3=subject  $4=ca  $5=alias
                pw=$(rand_pw 32)
                openssl ecparam -name prime256v1 -genkey -noout -out /tmp/c.key 2>/dev/null
                if [ "$4" = "true" ]; then
                  openssl req -new -x509 -key /tmp/c.key -out /tmp/c.crt -sha256 \
                    -days "$DAYS" -subj "$3" \
                    -addext "basicConstraints=critical,CA:TRUE" 2>/dev/null
                else
                  openssl req -new -x509 -key /tmp/c.key -out /tmp/c.crt -sha256 \
                    -days "$DAYS" -subj "$3" 2>/dev/null
                fi
                if [ -n "$5" ]; then
                  openssl pkcs12 -export -out /tmp/c.p12 -inkey /tmp/c.key \
                    -in /tmp/c.crt -name "$5" -passout "pass:$pw" 2>/dev/null
                else
                  openssl pkcs12 -export -out /tmp/c.p12 -inkey /tmp/c.key \
                    -in /tmp/c.crt -passout "pass:$pw" 2>/dev/null
                fi
                openssl base64 -A -in /tmp/c.p12 > "$OUT/$1"
                printf '%s' "$pw" > "$OUT/$2"
                rm -f /tmp/c.key /tmp/c.crt /tmp/c.p12
              }

              # base64 of "user:password", the form heidi.server.api.basic-auth
              # is stored in and the exact string the issuer and the verifier
              # send as `Authorization: Basic <value>`. One generated value under
              # several names, so both ends necessarily agree.
              gen_basicAuth() { # $1=key  $2=username
                printf '%s:%s' "$2" "$(rand_alnum 32)" | openssl base64 -A > "$OUT/$1"
              }

              # A recipe may publish the same generated bytes under more names —
              # see the basic-auth pair, which the API and its callers read from
              # differently named variables.
              alias_of() { cp "$OUT/$1" "$OUT/$2"; }

              # Derive the signing protocol's public key using the same HMAC
              # domain separation as heidi-signing-crypto. The signing service
              # receives only the platform public key; client seeds are projected
              # into their owning service deployments below.
              gen_signingClient() { # $1=seed key  $2=public-key key  $3=scheme
                if [ -f "/existing-signing-clients/$1" ]; then
                  cp "/existing-signing-clients/$1" "$OUT/$1"
                elif [ -f "/existing-signing-clients/$2" ]; then
                  echo "Existing signing public key $2 has no matching seed $1" >&2
                  exit 1
                else
                  gen_randomBase64 "$1" 32
                fi
                seed_hex=$(openssl base64 -d -A -in "$OUT/$1" | od -An -v -tx1 | tr -d ' \n')
                [ "${#seed_hex}" -eq 64 ] || { echo "Signing client seed $1 must decode to 32 bytes" >&2; exit 1; }
                printf 'AUTH PROVIDER%sFINISHED' "$3" \
                  | openssl dgst -sha256 -mac HMAC -macopt "hexkey:$seed_hex" -binary \
                  > /tmp/signing-client-ed25519-seed
                { printf '\060\056\002\001\000\060\005\006\003\053\145\160\004\042\004\040'; \
                  cat /tmp/signing-client-ed25519-seed; } > /tmp/signing-client-private.der
                openssl pkey -inform DER -in /tmp/signing-client-private.der \
                  -pubout -outform DER -out /tmp/signing-client-public.der 2>/dev/null
                tail -c 32 /tmp/signing-client-public.der \
                  | openssl base64 -A > "$OUT/$2"
                if [ -f "/existing-signing-clients/$2" ] \
                  && ! cmp -s "$OUT/$2" "/existing-signing-clients/$2"; then
                  echo "Stored signing public key $2 does not match seed $1; rotate the signing client secret pair together" >&2
                  exit 1
                fi
                rm -f /tmp/signing-client-ed25519-seed /tmp/signing-client-private.der \
                  /tmp/signing-client-public.der
              }

              gen_stableSigningSeed() { # $1=seed key
                if [ -f "/existing-signing-clients/$1" ]; then
                  cp "/existing-signing-clients/$1" "$OUT/$1"
                else
                  gen_randomBase64 "$1" 32
                fi
              }

              {{- range $r := $gen.recipes }}
              {{- if eq $r.type "random" }}
              gen_random {{ $r.name }} {{ $r.length | default 32 }}
              {{- else if eq $r.type "randomBase64" }}
              gen_randomBase64 {{ $r.name }} {{ $r.bytes | default 32 }}
              {{- else if eq $r.type "randomHex" }}
              gen_randomHex {{ $r.name }} {{ $r.bytes | default 32 }}
              {{- else if eq $r.type "ecKeyPair" }}
              gen_ecKeyPair {{ $r.name }} {{ required "ecKeyPair recipe needs publicKeyName" $r.publicKeyName }}
              {{- else if eq $r.type "p12" }}
              gen_p12 {{ $r.name }} {{ required "p12 recipe needs passwordName" $r.passwordName }} {{ $r.subject | default "/O=Default/CN=example.com" | quote }} {{ $r.ca | default false | quote }} {{ $r.alias | default "" | quote }}
              {{- else if eq $r.type "jwk" }}
              gen_jwk {{ $r.name }} {{ $r.use | default "sig" | quote }}
              {{- else if eq $r.type "basicAuth" }}
              gen_basicAuth {{ $r.name }} {{ $r.username | default "api" | quote }}
              {{- else }}
              {{- fail (printf "unknown devSecrets recipe type %q for key %s" $r.type $r.name) }}
              {{- end }}
              {{- range $a := $r.aliases }}
              alias_of {{ $r.name }} {{ $a }}
              {{- end }}
              {{- range $a := $r.passwordAliases }}
              alias_of {{ required "passwordAliases needs passwordName" $r.passwordName }} {{ $a }}
              {{- end }}
              {{- end }}

              {{- if $signingEnabled }}
              gen_signingClient HEIDI_PLATFORM_SIGNING_PROVIDER_CLIENT_SEED HEIDI_SIGNING_AUTH_CLIENTS_PLATFORM software
              gen_stableSigningSeed HEIDI_ISSUER_SIGNING_PROVIDER_CLIENT_SEED
              gen_stableSigningSeed HEIDI_VERIFIER_SIGNING_PROVIDER_CLIENT_SEED
              {{- end }}

              echo "Generated candidates: $(ls "$OUT" | tr '\n' ' ')"
      containers:
        - name: publish
          image: {{ $gen.image }}
          volumeMounts:
            - name: work
              mountPath: /work
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              SECRET_NAME={{ $gen.secretName | quote }}
              NS={{ .Values.global.namespace | quote }}

              EXISTING=$(kubectl get secret "$SECRET_NAME" -n "$NS" -o json 2>/dev/null || echo '{}')

              # Only keys absent from the Secret are uploaded; everything already
              # there keeps its current value.
              MISSING=""
              add() {
                if echo "$EXISTING" | jq -e --arg k "$1" '.data[$k] // empty' >/dev/null 2>&1; then
                  return 0
                fi
                MISSING="$MISSING $1"
              }

              # An alias added to a recipe after the Secret already exists must
              # take the value that is IN the Secret, not the one the init
              # container just generated — otherwise the two halves of a pair
              # that has to match would drift apart on that one upgrade.
              realias() { # $1=primary  $2=alias
                v=$(echo "$EXISTING" | jq -r --arg k "$1" '.data[$k] // empty')
                [ -z "$v" ] || echo "$v" | base64 -d > "/work/$2"
              }

              {{- range $r := $gen.recipes }}
              add {{ $r.name }}
              {{- if $r.publicKeyName }}
              add {{ $r.publicKeyName }}
              {{- end }}
              {{- if $r.passwordName }}
              add {{ $r.passwordName }}
              {{- end }}
              {{- range $a := $r.aliases }}
              realias {{ $r.name }} {{ $a }}
              add {{ $a }}
              {{- end }}
              {{- range $a := $r.passwordAliases }}
              realias {{ required "passwordAliases needs passwordName" $r.passwordName }} {{ $a }}
              add {{ $a }}
              {{- end }}
              {{- end }}

              if [ -n "$MISSING" ]; then
                echo "Adding:$MISSING to $SECRET_NAME"
                if echo "$EXISTING" | jq -e '.metadata.name' >/dev/null 2>&1; then
                  PATCH=$(for k in $MISSING; do
                    jq -n --arg k "$k" --arg v "$(base64 /work/$k | tr -d '\n')" '{($k): $v}'
                  done | jq -s 'add | {data: .}')
                  kubectl patch secret "$SECRET_NAME" -n "$NS" --type=merge -p "$PATCH"
                else
                  set --
                  for k in $MISSING; do set -- "$@" "--from-file=$k=/work/$k"; done
                  kubectl create secret generic "$SECRET_NAME" -n "$NS" "$@"
                fi
              else
                echo "All dev secrets already present in $SECRET_NAME — nothing to do."
              fi

              {{- if $signingEnabled }}
              SIGNING_SECRET_NAME={{ $signingSecretName | quote }}
              SIGNING_EXISTING=$(kubectl get secret "$SIGNING_SECRET_NAME" -n "$NS" -o json 2>/dev/null || echo '{}')
              SIGNING_MISSING=""
              add_signing() {
                if echo "$SIGNING_EXISTING" | jq -e --arg k "$1" '.data[$k] // empty' >/dev/null 2>&1; then
                  return 0
                fi
                SIGNING_MISSING="$SIGNING_MISSING $1"
              }
              add_signing HEIDI_PLATFORM_SIGNING_PROVIDER_CLIENT_SEED
              add_signing HEIDI_ISSUER_SIGNING_PROVIDER_CLIENT_SEED
              add_signing HEIDI_VERIFIER_SIGNING_PROVIDER_CLIENT_SEED
              add_signing HEIDI_SIGNING_AUTH_CLIENTS_PLATFORM
              if [ -n "$SIGNING_MISSING" ]; then
                echo "Adding:$SIGNING_MISSING to $SIGNING_SECRET_NAME"
                if echo "$SIGNING_EXISTING" | jq -e '.metadata.name' >/dev/null 2>&1; then
                  PATCH=$(for k in $SIGNING_MISSING; do
                    jq -n --arg k "$k" --arg v "$(base64 /work/$k | tr -d '\n')" '{($k): $v}'
                  done | jq -s 'add | {data: .}')
                  kubectl patch secret "$SIGNING_SECRET_NAME" -n "$NS" --type=merge -p "$PATCH"
                else
                  set --
                  for k in $SIGNING_MISSING; do set -- "$@" "--from-file=$k=/work/$k"; done
                  kubectl create secret generic "$SIGNING_SECRET_NAME" -n "$NS" "$@"
                fi
              else
                echo "All signing client secrets already present in $SIGNING_SECRET_NAME — nothing to do."
              fi
              {{- end }}

              # These bearer credentials were shared with every pod by older
              # chart versions. The registered-key setup no longer uses them.
              if echo "$EXISTING" | jq -e '.data.HEIDI_SIGNING_BEARER_TOKEN or .data.HEIDI_PLATFORM_GLOBAL_SIGNING_PROVIDER_BEARER_TOKEN or .data.HEIDI_SIGNING_REGISTRATION_BOOTSTRAP_TOKEN or .data.HEIDI_PLATFORM_GLOBAL_SIGNING_PROVIDER_REGISTRATION_BOOTSTRAP_TOKEN' >/dev/null; then
                kubectl patch secret "$SECRET_NAME" -n "$NS" --type=merge -p '{"data":{"HEIDI_SIGNING_BEARER_TOKEN":null,"HEIDI_PLATFORM_GLOBAL_SIGNING_PROVIDER_BEARER_TOKEN":null,"HEIDI_SIGNING_REGISTRATION_BOOTSTRAP_TOKEN":null,"HEIDI_PLATFORM_GLOBAL_SIGNING_PROVIDER_REGISTRATION_BOOTSTRAP_TOKEN":null}}'
              fi
{{- end }}
